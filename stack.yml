name: chatwoot
icon: chatwoot
docs: https://wodby.com/docs/2.0/stacks/catalog/chatwoot/
title: Chatwoot

services:
- name: chatwoot
  title: Chatwoot
  service: chatwoot
  required: true
  main: true
  replicas: 1
  derivatives:
  - name: sidekiq
    service: chatwoot-sidekiq
    required: true
    replicas: 1
    deployment:
      strategy: rolling
      minReady: 10s
      progressDeadline: 15m
      shutdownGracePeriod: 120s
  links:
  - name: db
    service: postgres
  - name: redis
    service: redis
  - name: storage
    service: storage
  - name: sendmail
    service: opensmtpd
  volumes:
  - name: storage
    size: 20

- name: postgres
  title: PostgreSQL
  service: postgres
  required: true
  env:
  - name: POSTGRES_DB_EXTENSIONS
    value: pg_stat_statements,pg_trgm,pgcrypto,vector
  - name: POSTGRES_SHARED_PRELOAD_LIBRARIES
    value: pg_stat_statements
  volumes:
  - name: data
    size: 20

- name: redis
  title: Redis
  service: redis
  required: true
  env:
  - name: REDIS_SAVE_TO_DISK
    value: '1'
  - name: REDIS_MAXMEMORY_POLICY
    value: noeviction
  volumes:
  - name: data
    size: 5

- name: storage
  title: Shared attachment storage
  service: nfs-provisioner
  required: true
  volumes:
  - name: data
    size: 25

- name: opensmtpd
  title: OpenSMTPD
  service: opensmtpd
  required: false
